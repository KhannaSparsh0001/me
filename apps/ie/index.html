<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Internet Explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@react95/sans-serif/index.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#008080;

font-family: 'R95 Sans Serif 8pt', 'MS Sans Serif', Tahoma, Verdana, sans-serif;
font-smooth: never;
-webkit-font-smoothing: none;

overflow:hidden;

}

.window{

width:500px;

background:#c0c0c0;

border:2px solid;
border-color:#fff #808080 #808080 #fff;

}

.title{

padding:5px 8px;

background:linear-gradient(90deg,#000080,#1084d0);

color:white;

font-weight:bold;

}

.content{

padding:30px;

text-align:center;

}

h2{

margin-bottom:20px;

}

#status{

font-size:18px;

margin-bottom:30px;

}

button{

padding:6px 20px;

background:#c0c0c0;

border:2px solid;
border-color:#fff #808080 #808080 #fff;

cursor:pointer;

}

button:active{

border-color:#808080 #fff #fff #808080;

}

.progress{

width:100%;

height:20px;

background:white;

margin:25px 0;

}

.bar{

height:100%;

width:0%;

background:#000080;

transition:.1s;

}

#error{

display:none;

}

</style>

</head>

<body>

<div class="window">

<div class="title">

Internet Explorer 5

</div>

<div style="background:#c0c0c0; border-bottom:2px solid; border-color:#fff #808080 #808080 #fff; padding:2px 10px; display:flex; gap:15px; font-size:12px;">
    <span style="cursor:pointer;" id="menu-file">File</span>
    <span style="cursor:pointer;" id="menu-help">Help</span>
</div>

<div class="content">

<div id="loading">

<h2>Connecting...</h2>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<p id="status">

Dialing Internet...

</p>

</div>

<div id="error">

<h2>

⚠ Fatal Error

</h2>

<p>

Internet Explorer has encountered an unexpected error.

<br><br>

Please install Netscape Navigator.

</p>

<br>

<button onclick="window.close()">

OK

</button>

</div>

</div>

</div>

<script>

let progress=0;

const bar=document.getElementById("bar");

const status=document.getElementById("status");

const loading=document.getElementById("loading");

const error=document.getElementById("error");

const msgs=[

"Dialing Internet...",

"Negotiating modem...",

"Loading ActiveX...",

"Opening homepage..."

];

let i=0;

const timer=setInterval(()=>{

progress+=5;

bar.style.width=progress+"%";

status.textContent=msgs[Math.min(i++,msgs.length-1)];

if(progress>=100){

clearInterval(timer);

loading.style.display="none";

error.style.display="block";

}

},100);

</script>

<script src="../../shared/processManager.js"></script>
<script>
    document.getElementById('menu-help').onclick = () => {
        let topScope = window;
        try { topScope = window.top; } catch(e) {}
        if (topScope.SystemAPI && topScope.SystemAPI.showAboutDialog) {
            topScope.SystemAPI.showAboutDialog({
                name: "Internet Explorer",
                version: "5.0",
                description: "Retro browser simulation included as part of the Windows 95 experience.",
                developer: "Sparsh Khanna",
                copyright: "2026",
                icon: "../../icons/ie.png" // fallback if not exist
            });
        }
    };
    if (window.ProcessManager) {
        window.ProcessManager.register("Internet Explorer.exe");
        window.addEventListener("unload", () => {
            window.ProcessManager.unregister("Internet Explorer.exe");
        });
    }
</script>
</body>
</html>
