<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<title>DOOM.EXE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@react95/sans-serif/index.min.css">
</head>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:black;
color:#00ff00;

font-family: 'Fixedsys', Consolas, "Courier New", monospace;

height:100vh;

overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

}

#screen{

width:100%;
height:100%;

padding:20px;

overflow:hidden;

}

.line{

opacity:0;

margin:4px 0;

white-space:pre;

animation:fade .15s forwards;

}

@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}

.progress{

margin-top:18px;

width:520px;

height:24px;

border:2px solid #00ff00;

padding:2px;

display:none;

}

.fill{

height:100%;

width:0%;

background:#00ff00;

}

.cursor{

display:inline-block;

width:10px;

background:#00ff00;

margin-left:3px;

animation:blink .8s infinite;

}

@keyframes blink{

50%{

opacity:0;

}

}

#launch{

display:none;

margin-top:20px;

color:white;

font-size:18px;

}

#jsdos{

display:none;

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

background:black;

}

</style>

</head>

<body>

<div id="help-btn" style="position:absolute; top:5px; right:5px; padding:2px 5px; background:#c0c0c0; color:#000; font-family:'R95 Sans Serif 8pt', 'MS Sans Serif', Tahoma, sans-serif; cursor:pointer; font-size:12px; font-weight:bold; z-index:100; border:2px solid; border-color:#fff #808080 #808080 #fff;">Help</div>

<div id="screen">

</div>

<script>

const screen=document.getElementById("screen");

const lines=[

"Microsoft(R) MS-DOS Version 6.22",

"(C) Copyright Microsoft Corp 1981-1994.",

"",

"C:\\>",

"doom",

"",

"Loading DOOM Engine...",

"Checking EMS Memory...............OK",

"Initializing Sound Blaster........OK",

"Detecting VGA.....................OK",

"Loading FreeDoom IWAD............OK",

"Preparing Renderer...............OK",

"",

];

let index=0;

function addLine(text){

const div=document.createElement("div");

div.className="line";

div.textContent=text;

screen.appendChild(div);

screen.scrollTop=screen.scrollHeight;

}

function nextLine(){

if(index<lines.length){

addLine(lines[index]);

index++;

document.getElementById("help-btn").onclick = () => {
    let topScope = window;
    try { topScope = window.top; } catch(e) {}
    if (topScope.SystemAPI && topScope.SystemAPI.showAboutDialog) {
        topScope.SystemAPI.showAboutDialog({
            name: "Doom",
            version: "0.13.0",
            description: "Classic DOS game running in the browser via js-dos.",
            developer: "id Software / FreeDoom",
            copyright: "1993",
            icon: "../../icons/notepad.png"
        });
    }
};

setTimeout(nextLine,250);

}

else{

startProgress();

}

}

const progress=document.createElement("div");

progress.className="progress";

progress.innerHTML="<div class='fill'></div>";

screen.appendChild(progress);

const fill=progress.firstChild;

function startProgress(){

progress.style.display="block";

let p=0;

const timer=setInterval(()=>{

p++;

fill.style.width=p+"%";

if(p>=100){

clearInterval(timer);

function launch(){

document.getElementById("screen").style.display="none";

const player=document.getElementById("jsdos");

player.style.display="block";

Dos(player,{
url:"../../assets/doom/freedoom.jsdos"
});

}

}

},18);

}

function launch(){

const msg=document.createElement("div");

msg.id="launch";

msg.innerHTML=

`

Launching DOOM...

`;

msg.style.display="block";

screen.appendChild(msg);

setTimeout(()=>{

/*

Phase 2

js-dos starts HERE.

*/

document.body.style.background="#111";

msg.innerHTML=

<div id="jsdos"></div>

},1000);

}

nextLine();

</script>

<script src="../../shared/processManager.js"></script>
<script>
    if (window.ProcessManager) {
        window.ProcessManager.register("DOOM.exe");
        window.addEventListener("unload", () => {
            window.ProcessManager.unregister("DOOM.exe");
        });
    }
</script>
</body>

</html>
