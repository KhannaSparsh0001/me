<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guest Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@react95/sans-serif/index.min.css">
    <link rel="stylesheet" href="guestbook.css">
</head>
<body>

<div class="toolbar">
    <button id="sign-btn">Sign Guest Book</button>
    <button id="refresh-btn">Refresh</button>
</div>

<div class="entries-container" id="entries-container">
    <div style="text-align: center; color: #7b7b7b; margin-top: 20px;">
        Loading entries from GitHub...
    </div>
</div>

<!-- Main Dialog Overlay -->
<div class="modal-overlay" id="dialog-overlay" style="display: none;">
    
    <!-- Form Dialog -->
    <div class="win95-dialog" id="form-dialog" style="display: none; width: 350px;">
        <div class="dialog-header">
            <span>Sign Guest Book</span>
            <div class="dialog-close" onclick="closeDialogs()">X</div>
        </div>
        <div class="dialog-body" style="gap: 10px;">
            <div class="form-group">
                <label for="gb-name">Name (required):</label>
                <input type="text" id="gb-name" class="win95-input" placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="gb-website">Website (optional):</label>
                <input type="text" id="gb-website" class="win95-input" placeholder="https://...">
            </div>
            <div class="form-group">
                <label for="gb-location">Location (optional):</label>
                <input type="text" id="gb-location" class="win95-input" placeholder="e.g. Germany">
            </div>
            <div class="form-group">
                <label for="gb-theme">Theme (optional):</label>
                <select id="gb-theme" class="win95-select">
                    <option value="">Default (Windows 95)</option>
                    <option value="matrix">The Matrix</option>
                    <option value="cyberpunk">Cyberpunk 2077</option>
                    <option value="amber">Amber Terminal</option>
                    <option value="synthwave">Synthwave</option>
                    <option value="spaceship">Spaceship HUD</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gb-mood">Mood (optional):</label>
                <select id="gb-mood" class="win95-select">
                    <option value="">Select a mood...</option>
                    <option value="Happy">Happy</option>
                    <option value="Inspired">Inspired</option>
                    <option value="Nostalgic">Nostalgic</option>
                    <option value="Curious">Curious</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gb-message">Message (required):</label>
                <textarea id="gb-message" class="win95-textarea" rows="4" placeholder="Leave a message..."></textarea>
            </div>
            <div class="dialog-buttons" style="margin-top: 10px;">
                <button id="submit-form-btn" style="width: 120px;">Sign Guestbook</button>
                <button onclick="closeDialogs()" style="width: 80px;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Networking Sequence Dialog -->
    <div class="win95-dialog" id="network-dialog" style="display: none;">
        <div class="dialog-header">
            <span>Connecting...</span>
        </div>
        <div class="dialog-body">
            <div id="network-status" style="margin-bottom: 10px;">Dialing github.com...</div>
            <div class="progress-bar-container" id="progress-bar">
                <!-- Blocks will be added here via JS -->
            </div>
        </div>
    </div>

    <!-- Error Dialog -->
    <div class="win95-dialog" id="error-dialog" style="display: none;">
        <div class="dialog-header">
            <span>Error</span>
            <div class="dialog-close" onclick="closeDialogs()">X</div>
        </div>
        <div class="dialog-body">
            <div style="display: flex; gap: 15px; align-items: flex-start;">
                <div style="font-size: 32px;">❌</div>
                <div id="error-message">
                    Unable to contact GitHub.<br>
                    The guest book is currently unavailable.
                </div>
            </div>
            <div class="dialog-buttons">
                <button onclick="closeDialogs()" style="width: 80px;">OK</button>
            </div>
        </div>
    </div>

</div>

<!-- Scripts -->
<script src="../../services/guestbook/github.js"></script>
<script src="guestbook.js"></script>
</body>
</html>
