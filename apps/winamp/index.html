<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winamp 95</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #c0c0c0; /* Standard retro background if opened standalone */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
        }
        
        /* Ensures it looks fine if opened inside a modal iframe */
        html, body {
            overflow: hidden;
            background: transparent; 
        }

        .winamp-container {
            width: 275px;
            background-color: #1c1c24;
            border: 2px solid #3c3c44;
            border-radius: 3px;
            padding: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            color: #d1d1d1;
            user-select: none;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d0);
            padding: 2px 5px;
            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            color: white;
            display: flex;
            justify-content: space-between;
            border: 1px solid #000;
            margin-bottom: 5px;
        }

        .main-display {
            background-color: #000;
            border: 2px inset #444;
            height: 60px;
            margin-bottom: 10px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .track-info {
            color: #00ff00;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .time-display {
            color: #00ff00;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .btn {
            background-color: #333;
            color: #ccc;
            border: 2px outset #555;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn:active {
            border-style: inset;
            background-color: #222;
        }

        .slider-container {
            display: flex;
            align-items: center;
            font-size: 10px;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
            color: #ccc;
        }
        
        .slider-container input {
            flex-grow: 1;
            margin-left: 5px;
        }

        .playlist {
            background-color: #000;
            border: 2px inset #444;
            height: 120px;
            overflow-y: auto;
            padding: 2px;
        }

        .playlist-item {
            color: #00ff00;
            font-size: 11px;
            padding: 3px;
            cursor: pointer;
            border-bottom: 1px dashed #222;
        }

        .playlist-item:hover, .playlist-item.active {
            background-color: #000080;
            color: white;
        }

        .bottom-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }
        .bottom-btn {
            background-color: #333;
            color: #ccc;
            border: 1px outset #555;
            font-size: 10px;
            padding: 2px 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        .bottom-btn:active {
            border-style: inset;
        }
    </style>
</head>
<body>

    <div class="winamp-container">
        <div class="title-bar">
            <span>WINAMP 95</span>
        </div>
        
        <div class="main-display">
            <div class="track-info" id="track-name">1. No track loaded</div>
            <div class="time-display" id="time-display">00:00</div>
        </div>

        <div class="controls">
            <button class="btn" id="btn-prev" title="Previous">|&lt;&lt;</button>
            <button class="btn" id="btn-play" title="Play">&gt;</button>
            <button class="btn" id="btn-pause" title="Pause">||</button>
            <button class="btn" id="btn-stop" title="Stop">[]</button>
            <button class="btn" id="btn-next" title="Next">&gt;&gt;|</button>
        </div>

        <div class="slider-container">
            VOL: <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="playlist" id="playlist">
            <!-- Playlist items go here -->
        </div>

        <div class="bottom-controls">
            <button class="bottom-btn" id="btn-add">ADD LOCAL FILE(S)</button>
            <input type="file" id="file-input" accept="audio/*" multiple style="display:none;">
        </div>

        <audio id="audio-player"></audio>
    </div>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('btn-play');
        const pauseBtn = document.getElementById('btn-pause');
        const stopBtn = document.getElementById('btn-stop');
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const volSlider = document.getElementById('vol-slider');
        const trackNameDisplay = document.getElementById('track-name');
        const timeDisplay = document.getElementById('time-display');
        const playlistEl = document.getElementById('playlist');
        
        const fileInput = document.getElementById('file-input');
        const addBtn = document.getElementById('btn-add');

        let tracks = [];
        let currentTrackIndex = 0;
        let isPlaying = false;

        // Fetch playlist from assets folder
        fetch('../../assets/playlist.json')
            .then(response => response.json())
            .then(data => {
                if(Array.isArray(data)) {
                    tracks = data;
                    if (tracks.length > 0) {
                        loadTrack();
                    } else {
                        renderPlaylist();
                    }
                }
            })
            .catch(err => {
                console.error("Could not load playlist.json. Ensure you are running a local server to fetch.", err);
                renderPlaylist();
            });

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (index === currentTrackIndex ? ' active' : '');
                item.textContent = `${index + 1}. ${track.name}`;
                item.onclick = () => {
                    currentTrackIndex = index;
                    loadTrack();
                    playTrack();
                };
                playlistEl.appendChild(item);
            });
        }

        function loadTrack() {
            if (tracks.length === 0) return;
            const track = tracks[currentTrackIndex];
            
            if (track.file) {
                audio.src = URL.createObjectURL(track.file);
            } else {
                audio.src = track.url;
            }
            
            trackNameDisplay.textContent = `${currentTrackIndex + 1}. ${track.name}`;
            renderPlaylist();
        }

        function playTrack() {
            if (tracks.length === 0) return;
            
            // Try playing, catch errors (e.g. file missing)
            audio.play().then(() => {
                isPlaying = true;
            }).catch(err => {
                console.error("Error playing track. File might not exist in assets folder:", err);
                trackNameDisplay.textContent = "Error: File missing";
                isPlaying = false;
            });
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
        }

        function stopTrack() {
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
            updateTimeDisplay();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function updateTimeDisplay() {
            timeDisplay.textContent = formatTime(audio.currentTime);
        }

        // Event Listeners
        playBtn.onclick = playTrack;
        pauseBtn.onclick = pauseTrack;
        stopBtn.onclick = stopTrack;
        
        prevBtn.onclick = () => {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack();
            playTrack();
        };
        
        nextBtn.onclick = () => {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack();
            playTrack();
        };

        volSlider.oninput = (e) => {
            audio.volume = e.target.value;
        };

        audio.ontimeupdate = updateTimeDisplay;
        
        audio.onended = () => {
            nextBtn.onclick();
        };

        // File Input Handling (allows adding local files directly in browser without backend)
        addBtn.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                tracks.push({
                    name: files[i].name,
                    file: files[i]
                });
            }
            if (tracks.length > 0 && (!audio.src || audio.src.endsWith('index.html'))) {
                loadTrack();
            }
            renderPlaylist();
        };

        // Initialize
        audio.volume = volSlider.value;
    </script>
</body>
</html>
