<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notepad</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@react95/sans-serif/index.min.css">
<link rel="stylesheet" href="../../style.css">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    background:#c0c0c0;
    font-family: 'MS Sans Serif', Tahoma, Verdana, sans-serif;
    font-smooth: never;
    -webkit-font-smoothing: none;
    overflow:hidden;
    cursor: default;
}

*{
    cursor: default;
}

.menu{
    height:28px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 10px;
    background:#c0c0c0;
    border-bottom:2px solid;
    border-color:#fff #808080 #808080 #fff;
    font-size:13px;
}

textarea{

    width:100%;
    height:calc(100vh - 58px);

    resize:none;

    border:none;
    outline:none;

    padding:10px;

    font-family: 'Fixedsys', "Courier New", monospace;
    font-size: 15px;
    line-height: 1.2;

    background:white;
    color:black;
    cursor: text !important;
}

.status{

    height:30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 10px;

    background:#c0c0c0;

    border-top:2px solid;
    border-color:#fff #808080 #808080 #fff;

    font-size:12px;

}

button{

    padding:2px 12px;

    border:2px solid;
    border-color:#fff #808080 #808080 #fff;

    background:#c0c0c0;

    cursor:pointer !important;

}

button:active{

    border-color:#808080 #fff #fff #808080;

}

</style>
</head>

<body>

<div class="menu">

<span>File</span>
<span>Edit</span>
<span>Search</span>
<span id="help-btn">Help</span>

<button id="download">
Save</button>

<button id="clear">
Clear
</button>

</div>

<textarea
id="editor"
spellcheck="false"
placeholder="Type something..."
></textarea>

<div class="status">

<span id="chars">0 Characters</span>

<span>
Auto Saved
</span>

</div>

<script>

const editor=document.getElementById("editor");

const chars=document.getElementById("chars");

editor.value=localStorage.getItem("retro_notepad")||"";

updateCount();

editor.addEventListener("input",()=>{

localStorage.setItem("retro_notepad",editor.value);

updateCount();

});

function updateCount(){

chars.textContent=editor.value.length+" Characters";

}

document.getElementById("clear").onclick=()=>{

if(confirm("Clear the document?")){

editor.value="";

localStorage.removeItem("retro_notepad");

updateCount();

}

};

document.getElementById("download").onclick=()=>{

const blob=new Blob([editor.value],{type:"text/plain"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="notes.txt";

a.click();

URL.revokeObjectURL(a.href);

};

</script>

<script src="../../shared/processManager.js"></script>
<script>
    let topScope = window;
    try {
        if (window.top && window.top.document) {
            topScope = window.top;
        }
    } catch (e) {}

    if (topScope.ProcessManager) {
        topScope.ProcessManager.register("Notepad.exe");
        window.addEventListener("unload", () => {
            topScope.ProcessManager.unregister("Notepad.exe");
        });
    }

    document.getElementById("help-btn").onclick = () => {
        let topScope = window;
        try { topScope = window.top; } catch(e) {}
        if (topScope.SystemAPI && topScope.SystemAPI.showAboutDialog) {
            topScope.SystemAPI.showAboutDialog({
                name: "Notepad",
                version: "1.0",
                description: "Lightweight text editor for notes and plain text editing.",
                developer: "Sparsh Khanna",
                copyright: "2026",
                icon: "../../icons/notepad.png"
            });
        }
    };
</script>
</body>
</html>
