<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Windows 95 - Wolfenstein 3D</title>
    <!-- Load the JS-DOS engine -->
    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <style>
        body { background-color: #008080; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .window { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 2px; }
        canvas { width: 640px; height: 400px; display: block; outline: none; }
    </style>
</head>
<body>

    <div class="window">
        <canvas id="wolf-canvas" tabindex="0" onclick="this.focus()"></canvas>
    </div>

    <script>
        // Initialize the emulator
        Dos(document.getElementById("wolf-canvas"), {
            wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js"
        }).ready(function (fs, main) {
            // Extract the Wolfenstein zip
            fs.extract("wolf3d.zip").then(function () {
                // Run the Wolfenstein executable
                main(["-c", "WOLF3D.EXE"]); 
            });
        });
    </script>

</body>
</html>
