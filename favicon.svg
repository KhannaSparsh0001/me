<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#1b2333"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#56f0e0"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
  </defs>
  <!-- Rounded Square Body -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#56f0e0" stroke-width="2.5"/>
  <!-- Pixel Initials: S K -->
  <!-- S -->
  <rect x="14" y="16" width="16" height="5" fill="url(#cyanGrad)"/>
  <rect x="14" y="21" width="6" height="8" fill="url(#cyanGrad)"/>
  <rect x="14" y="29" width="16" height="5" fill="url(#cyanGrad)"/>
  <rect x="24" y="34" width="6" height="8" fill="url(#cyanGrad)"/>
  <rect x="14" y="42" width="16" height="5" fill="url(#cyanGrad)"/>
  <!-- K -->
  <rect x="36" y="16" width="6" height="31" fill="#f2cc60"/>
  <rect x="46" y="18" width="5" height="7" fill="#f2cc60"/>
  <rect x="42" y="25" width="5" height="6" fill="#f2cc60"/>
  <rect x="42" y="31" width="5" height="6" fill="#f2cc60"/>
  <rect x="46" y="37" width="5" height="10" fill="#f2cc60"/>
</svg>
