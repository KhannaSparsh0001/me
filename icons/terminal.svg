<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Retro Windows 95 3D Bevel Window -->
  <rect x="2" y="4" width="44" height="40" fill="#c0c0c0" stroke="#dfdfdf" stroke-width="2"/>
  <rect x="2" y="4" width="44" height="40" fill="none" stroke="#808080" stroke-width="2" stroke-dasharray="0,46,86,0"/>
  <!-- Title bar -->
  <rect x="5" y="7" width="38" height="7" fill="#000080"/>
  <rect x="37" y="8" width="5" height="5" fill="#c0c0c0"/>
  <text x="39" y="12" font-family="monospace" font-size="5" fill="#000" font-weight="bold">x</text>
  <!-- Terminal Screen -->
  <rect x="5" y="15" width="38" height="26" fill="#0c1017"/>
  <!-- Prompt & Cursor -->
  <text x="8" y="25" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#39d353">&gt;_</text>
  <rect x="23" y="19" width="5" height="7" fill="#39d353">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="8" y="36" font-family="'Courier New', monospace" font-size="7" fill="#58a6ff">bash</text>
</svg>